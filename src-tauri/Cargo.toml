[package]
name = "aiterm"
version = "2.5.0"
description = "A Tauri-based terminal organizer"
authors = ["you"]
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "aiterm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Format-preserving TOML editing for ~/.codex/config.toml (keeps user comments/layout).
toml_edit = "0.22"
flate2 = "1"
portable-pty = "0.8"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
log = "0.4"
tauri-plugin-mcp-bridge = { version = "0.8", optional = true }
base64 = "0.22.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", features = ["ws"] }
# maiLink mobile-companion LAN bridge (docs/mailink-protocol.md): self-signed TLS via rcgen,
# served over axum-server; rustls pinned to the ring provider (installed at listener start).
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
sha2 = "0.10"
# maiLink doorbell: POST the content-free wake to the push relay (Cloudflare worker).
reqwest = { version = "0.13", features = ["json", "multipart"] }
rand = "0.8"
libc = "0.2"
# macOS backend MUST be FSEvents, not kqueue. We watch a file's PARENT directory
# (to catch atomic write-temp-then-rename saves). kqueue opens one fd per file in
# the watched dir, so a tab on a file inside a large dir (e.g. node_modules/lodash,
# 600+ files) exhausts the process fd limit and breaks the MCP listener's accept().
# FSEvents is path-based and costs ~1 fd per watch regardless of directory size.
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
sysinfo = "0.33"
alacritty_terminal = "0.25"
rusqlite = { version = "0.31", features = ["bundled"] }
ignore = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The credential vault for managed-account tokens (docs/login.md §9.1 — "tokens go in the OS
# keychain under maiTerm's OWN service name"). One native store per platform, named explicitly
# rather than taking the crate's defaults, which enable the Linux Secret Service backend on
# every target and drag zbus into the macOS build for nothing. `v1` is the API surface; without
# it keyring refuses to compile at all.
[target.'cfg(target_os = "macos")'.dependencies]
# `keychain`, not `protected`: the Data Protection Keychain needs a keychain-access-group
# entitlement, which a `cargo run` dev build does not carry — so `protected` would work in the
# signed bundle and fail on every developer machine, which is the worst of both.
#
# keyring does not re-export its stores' own features, so the store is ALSO named directly below
# purely so `keychain` gets switched on; cargo's feature unification applies it to keyring's
# copy. Nothing in this crate imports it — remove that line and the build fails inside keyring.
keyring = { version = "4", default-features = false, features = ["v1", "apple-native-keyring-store"] }
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

# Window/webview base colour (commands::window::set_window_background). Same versions
# wry already pulls in; default features off so only the two bindings we call land.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

# Secret Service rather than linux-keyutils: keyutils is a kernel keyring that does not survive
# a reboot, and a one-year token that silently vanishes on restart is the exact failure this
# feature exists to remove. The zbus backend is pure Rust, so it needs no libdbus at build time.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

# Windows is gated off for accounts (`RuntimeProfile::supported` is `cfg!(unix)`), but the vault
# still has to COMPILE there — the Windows CI job builds the whole crate.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[dev-dependencies]
# `ServiceExt::oneshot` — drives the maiLink router in-process (no TLS, no listener).
tower = { version = "0.5", features = ["util"] }

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
